{% extends 'accounts/base.html' %}
{% block title %}Backup System – LibraryMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <i class="bi bi-database-fill-down text-primary mb-3" style="font-size:3rem;"></i>
            <h5 class="fw-bold mb-2">Backup System Data</h5>
            <p class="text-muted mb-4">This will create a timestamped backup of the database and media files in the
                <code>backups/</code> directory.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-download me-2"></i>Run Backup Now
                    </button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
