{% extends 'accounts/base.html' %}
{% block title %}Cancel Reservation – LibraryMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 text-center">
            <i class="bi bi-bookmark-x text-danger mb-3" style="font-size:3rem;"></i>
            <h5 class="fw-bold mb-2">Cancel Reservation?</h5>
            <p class="text-muted mb-1">You are about to cancel your reservation for:</p>
            <p class="fw-bold mb-4">{{ reservation.book.title }}</p>
            <form method="post" class="d-flex gap-3 justify-content-center">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">
                    <i class="bi bi-x-circle me-2"></i>Yes, Cancel
                </button>
                <a href="{% url 'my_reservations' %}" class="btn btn-outline-secondary px-4">Keep It</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
