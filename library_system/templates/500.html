<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Error | Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        .error-icon {
            font-size: 6rem;
            color: #dc2626;
            opacity: .15;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 800;
            color: #dc2626;
            line-height: 1;
            letter-spacing: -.04em;
        }
    </style>
</head>

<body>
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="text-center px-4">
            <i class="bi bi-exclamation-triangle error-icon d-block mb-2"></i>
            <div class="error-code">500</div>
            <h2 class="fw-bold mt-3 mb-2">Something Went Wrong</h2>
            <p class="text-muted mb-4">An unexpected error occurred. Our team has been notified.</p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="/" class="btn btn-danger px-4">
                    <i class="bi bi-house me-2"></i>Go Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </a>
            </div>
            <p class="text-muted small mt-5">
                <i class="bi bi-book-half text-primary me-1"></i> Smart Library
            </p>
        </div>
    </div>
</body>

</html>
