{% extends 'accounts/base.html' %}
{% block title %}Password Reset Complete – Smart Library{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow text-center">
            <i class="bi bi-shield-check text-success mb-3" style="font-size:4rem;"></i>
            <h4 class="fw-bold mb-2">Password Reset Complete</h4>
            <p class="text-muted mb-4">Your password has been set. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-4">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
