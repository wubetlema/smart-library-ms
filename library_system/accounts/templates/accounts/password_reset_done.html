{% extends 'accounts/base.html' %}
{% block title %}Check Your Email – Smart Library{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow text-center">
            <i class="bi bi-envelope-check text-success mb-3" style="font-size:4rem;"></i>
            <h4 class="fw-bold mb-2">Check Your Email</h4>
            <p class="text-muted mb-4">If an account exists with that email, we've sent password reset instructions.
                Check your inbox (and spam folder).</p>
            <a href="{% url 'login' %}" class="btn btn-primary px-4">
                <i class="bi bi-box-arrow-in-right me-2"></i>Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
