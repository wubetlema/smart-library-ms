{% extends 'accounts/base.html' %}
{% block title %}Forgot Password – Smart Library{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning mb-3"
                    style="width:64px;height:64px;">
                    <i class="bi bi-key text-white fs-2"></i>
                </div>
                <h4 class="fw-bold mb-1">Forgot Password?</h4>
                <p class="text-muted small mb-0">Enter your email and we'll send reset instructions</p>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope text-primary"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning btn-lg fw-semibold">
                        <i class="bi bi-send me-2"></i>Send Reset Link
                    </button>
                </div>
            </form>
            <hr class="my-3">
            <p class="text-center mb-0 small">
                Remember your password? <a href="{% url 'login' %}" class="text-primary fw-semibold">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
